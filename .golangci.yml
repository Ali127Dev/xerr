version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign

    # code quality
    - revive
    - gocritic
    - goconst
    - gocyclo

    # bugs
    - gosec
    - bodyclose
    - nilerr
    - noctx

    # style
    - whitespace

    # performance
    - prealloc
    - unconvert

    # misc
    - misspell
    - nakedret
    - depguard
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: log$
              desc: use structured logger (log/slog) instead of standard log
    errcheck:
      check-type-assertions: true
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocyclo
        path: _test\.go
      - linters:
          - gosec
        path: mock
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
